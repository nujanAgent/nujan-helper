# Version catalog for Nujan Helper.
# Pinned to the SAME toolchain as NuJan (H:\Projects\claude\1) so the two apps share one
# mental model and build with the Android Studio JBR (JDK 21). A system JDK 25 will NOT build
# AGP — run from Studio or point org.gradle.java.installations.paths at the JBR.
[versions]
agp = "9.2.1"
kotlin = "2.4.0"
ksp = "2.3.9"
coroutines = "1.11.0"
serialization = "1.11.0"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExt = "1.3.0"
junit = "4.13.2"
xz = "1.10"
androidxAnnotation = "1.10.0"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

# Pure-Java XZ (LZMA2) decoder. Used to decompress the rootfs tarball on-device: Android has no
# `xz` binary and `toybox tar` shells out to one, so we stream `.tar.xz` -> tar bytes in-JVM
# and pipe the tar into `proot ... toybox tar x`. Public domain, no native code.
tukaani-xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
